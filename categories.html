<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Categories - Karsel Blog</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 카테고리 페이지 전용 추가 스타일 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .category-item {
            background: #fff;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eee;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }
        .category-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #007acc;
            color: #007acc;
        }
        .category-item i { font-size: 2rem; margin-bottom: 15px; display: block; color: #007acc; }
        .category-item span { font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="profile">
                <img src="Frontier_M.jpg" alt="Profile" class="avatar">
                <h2>Karsel</h2>
                <p>A text-focused blog</p>
            </div>
            <nav class="side-nav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> HOME</a></li>
                    <li><a href="categories.html"><i class="fas fa-th-large"></i> CATEGORIES</a></li>
                    <li><a href="#"><i class="fas fa-tag"></i> TAGS</a></li>
                    <li><a href="#"><i class="fas fa-archive"></i> ARCHIVES</a></li>
                    <li><a href="#"><i class="fas fa-info-circle"></i> ABOUT</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-nav">
                <span>Categories</span>
                <div class="search-bar"><i class="fas fa-search"></i> Search...</div>
            </header>

            <h2>Categories</h2>
            <div class="category-grid">
                <a href="categories/개발/" class="category-item"><i class="fas fa-code"></i><span>개발</span></a>
                <a href="#" class="category-item"><i class="fas fa-flag"></i><span>CTF/Wargame</span></a>
                <a href="#" class="category-item"><i class="fas fa-bug"></i><span>BugBounty</span></a>
                <a href="#" class="category-item"><i class="fas fa-file-alt"></i><span>블로그/기술문서</span></a>
                <a href="#" class="category-item"><i class="fas fa-graduation-cap"></i><span>논문/컨퍼런스</span></a>
                <a href="#" class="category-item"><i class="fas fa-award"></i><span>공모전/자격증</span></a>
            </div>
        </main>
    </div>
</body>
</html>
